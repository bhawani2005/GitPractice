<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hibernate Assessment Result</title>
  <style>
    :root {
      --bg: #eef4fa;
      --card: #ffffff;
      --primary: #1d4e89;
      --primary-dark: #163c6b;
      --border: #dfeaf6;
      --soft: #f7faff;
      --danger: #c83d32;
      --warning: #7a5409;
      --success: #1e6848;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #edf4fb 0%, var(--bg) 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: #1d2433;
      line-height: 1.6;
    }
    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px 50px;
    }
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 16px 32px rgba(19, 43, 77, 0.08);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      padding: 28px 26px;
    }
    .header h1 { margin: 0; font-size: clamp(2rem, 4vw, 2.8rem); }
    .content { padding: 28px 26px 30px; }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 18px 0 26px;
    }
    .status-box {
      background: #f8fbff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .status-box strong { display: block; color: var(--primary-dark); margin-bottom: 5px; }
    .status-box .value { font-size: 1.02rem; font-weight: bold; }
    .section {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .section h2 {
      margin: 0 0 12px;
      color: var(--primary);
      font-size: 1.35rem;
    }
    .summary-box {
      background: var(--soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .feedback {
      background: #eefaf4;
      border: 1px solid #cfe9d9;
      color: var(--success);
      border-radius: 12px;
      padding: 15px 18px;
      font-weight: bold;
    }
    .invalid {
      background: #fff3f2;
      border: 1px solid #f3c7c4;
      color: var(--danger);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 18px;
      font-weight: bold;
    }
    .button-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 28px;
    }
    .btn {
      text-decoration: none;
      display: inline-block;
      border-radius: 12px;
      padding: 14px 22px;
      font-weight: bold;
    }
    .primary {
      background: linear-gradient(135deg, #2d9cdb 0%, #1f83ca 100%);
      color: #fff;
      box-shadow: 0 10px 22px rgba(45, 156, 219, 0.18);
    }
    .secondary {
      background: #edf3fb;
      color: var(--primary-dark);
      border: 1px solid #d7e5f8;
    }
    @media (max-width: 600px) {
      .container { padding: 18px 14px 40px; }
      .header, .content { padding-left: 18px; padding-right: 18px; }
      .button-row { flex-direction: column; }
      .btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="result-card">
      <div class="header">
        <h1>Hibernate Assessment Result</h1>
      </div>
      <div class="content">
        <script>
          const params = new URLSearchParams(window.location.search);
          const userName = params.get('userName') || 'Not provided';
          const email = params.get('email') || 'Not provided';
          const summary = params.get('summary') || 'No summary entered';

          function isValidName(name) {
            if (!name || !name.trim()) return false;
            return /^[A-Z][A-Za-z\s'-]*$/.test(name.trim());
          }

          function isValidEmail(emailText) {
            if (!emailText || !emailText.trim() || emailText.includes(' ')) return false;
            return /^[A-Za-z0-9._%+-]+@gmail\.com$/.test(emailText.trim());
          }

          function normalizeText(text) {
            return (text || '').trim();
          }

          const keywords = [
            'Hibernate ORM', 'Object-Relational Mapping', 'Entities', '@Entity', '@Id', '@GeneratedValue',
            'Primary Key', 'SessionFactory', 'Session', 'CRUD Operations', 'Transaction', 'Commit',
            'Rollback', 'HQL', 'JPQL', 'Criteria API', 'Native SQL', 'Lazy Loading', 'Eager Loading',
            'Cascade', 'Dirty Checking', 'First-Level Cache', 'Second-Level Cache',
            'Optimistic Locking', 'Pessimistic Locking'
          ];

          function normalizeForMatch(value) {
            return (value || '').toLowerCase();
          }

          function containsKeyword(text, keyword) {
            const haystack = normalizeForMatch(text);
            const needle = normalizeForMatch(keyword);
            if (!needle) return false;
            const pattern = new RegExp('(?<![A-Za-z0-9_@])' + needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z0-9_@])', 'i');
            return pattern.test(haystack);
          }

          const nameValid = isValidName(userName);
          const emailValid = isValidEmail(email);
          const summaryText = normalizeText(summary);
          const uniqueKeywords = [...new Set(keywords.map(k => k.trim()))];
          const matchedKeywords = uniqueKeywords.filter(keyword => containsKeyword(summaryText, keyword));
          const percentage = uniqueKeywords.length > 0 ? (matchedKeywords.length / uniqueKeywords.length) * 100 : 0;
          const rounded = Math.round(percentage * 100) / 100;

          let rating = 6;
          if (rounded < 50) rating = 6;
          else if (rounded < 60) rating = 7;
          else if (rounded < 80) rating = 8;
          else if (rounded < 100) rating = 9;
          else rating = 10;

          let feedback = 'Needs improvement. Review the Hibernate concepts carefully and include more key terms in your summary.';
          if (rounded >= 50 && rounded < 60) feedback = 'Good effort! You covered many important topics, but a few key concepts are still missing.';
          else if (rounded >= 60 && rounded < 80) feedback = 'Good job! Your summary covers most key Hibernate ideas. Review the remaining concepts for even better coverage.';
          else if (rounded >= 80 && rounded < 100) feedback = 'Excellent work! Your summary includes most important Hibernate topics and shows a strong understanding.';
          else if (rounded === 100) feedback = 'Excellent! You matched all important Hibernate keywords and demonstrated strong understanding.';

          if (!nameValid || !emailValid) {
            feedback = 'Your submission cannot be considered complete because the name or email is invalid. Please fix the values and try again.';
          }

          const validSubmission = nameValid && emailValid && summaryText !== '';

          document.write(`
            ${!validSubmission ? '<div class="invalid">This page must be accessed through the valid assessment flow. Please return to the learning page and submit the test form correctly.</div>' : ''}
            <div class="status-grid">
              <div class="status-box"><strong>User Name</strong><div class="value">${userName}</div></div>
              <div class="status-box"><strong>Email ID</strong><div class="value">${email}</div></div>
              <div class="status-box"><strong>Name Validation Status</strong><div class="value">${nameValid ? 'Passed' : 'Failed'}</div></div>
              <div class="status-box"><strong>Email Validation Status</strong><div class="value">${emailValid ? 'Passed' : 'Failed'}</div></div>
              <div class="status-box"><strong>Assessment Status</strong><div class="value">${validSubmission ? (rounded < 50 ? 'Needs Improvement' : 'Assessment Completed') : 'Assessment Incomplete'}</div></div>
              <div class="status-box"><strong>Final Rating</strong><div class="value">${rating}/10</div></div>
            </div>
          `);

          if (validSubmission) {
            document.write(`
              <div class="section">
                <h2>Assessment Summary</h2>
                <div class="status-grid">
                  <div class="status-box"><strong>Total Unique Keywords</strong><div class="value">${uniqueKeywords.length}</div></div>
                  <div class="status-box"><strong>Matched Keywords</strong><div class="value">${matchedKeywords.length}</div></div>
                  <div class="status-box"><strong>Unmatched Keywords</strong><div class="value">${uniqueKeywords.length - matchedKeywords.length}</div></div>
                  <div class="status-box"><strong>Match Percentage</strong><div class="value">${rounded.toFixed(2)}%</div></div>
                </div>
              </div>
              <div class="section">
                <h2>Submitted Summary</h2>
                <div class="summary-box">${summaryText.replace(/\n/g, '<br>')}</div>
              </div>
              <div class="section">
                <h2>Matched Keywords</h2>
                <div class="summary-box">${matchedKeywords.length ? matchedKeywords.map(k => '<span style="display:inline-block; margin:4px 6px 4px 0; background:#edf7ff; border:1px solid #dceaf9; border-radius:999px; padding:6px 10px;">' + k + '</span>').join(' ') : 'No keyword matches found.'}</div>
              </div>
              <div class="section">
                <h2>Feedback</h2>
                <div class="feedback">${feedback}</div>
              </div>
            `);
          } else {
            document.write(`
              <div class="section">
                <h2>Feedback</h2>
                <div class="feedback">Please complete the form correctly to generate a valid assessment result.</div>
              </div>
            `);
          }

          document.write(`
            <div class="button-row">
              <a class="btn primary" href="hibernateAbout.html">Back to About</a>
              <a class="btn secondary" href="hibernateTest.html">Try Again</a>
            </div>
          `);
        </script>
      </div>
    </div>
  </div>
</body>
</html>
